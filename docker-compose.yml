services:
  the-cartographer:
    build: .
    ports:
      # Only this computer. To serve your network or the internet, use "8080:80" (see the README).
      - "127.0.0.1:8080:80"
    volumes:
      # Swap images in ./public/assets without rebuilding the image
      - ./public/assets:/usr/share/nginx/html/assets:ro
    depends_on:
      - proxy
    restart: unless-stopped

  # Nextcloud proxy (server.py): checks the typed address before connecting.
  # No published port: only the nginx above talks to it.
  proxy:
    image: python:3.12-alpine
    command: python /app/server.py
    # Unprivileged user: the proxy only reads server.py and opens network connections
    user: "65534:65534"
    environment:
      - PORT=8081
      # All interfaces of the internal Docker network only (no published port), so nginx reaches it
      - HOST=0.0.0.0
      # Google Drive and OneDrive IDs, read from the .env file (outside git)
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - ONEDRIVE_CLIENT_ID=${ONEDRIVE_CLIENT_ID:-}
    volumes:
      - ./server/server.py:/app/server.py:ro
    restart: unless-stopped
