services:
  the-cartographer:
    build: .
    ports:
      # APP_PORT (default 8080) and APP_BIND (default 127.0.0.1 = only this machine) come from .env.
      # Behind a reverse proxy with HTTPS (recommended on a server), keep APP_BIND=127.0.0.1.
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-8080}:80"
    volumes:
      # The site and nginx config are read from this folder, so updates need no rebuild and no
      # downtime: `git pull` (site), plus `docker compose exec the-cartographer nginx -s reload`
      # if the nginx config changed (see the README). Folders, not single files: git replaces files
      # on pull, and a single-file mount would keep showing the old one.
      - ./public:/usr/share/nginx/html:ro
      - ./server:/etc/nginx/cartographer:ro
    depends_on:
      - proxy
    restart: unless-stopped

  # Nextcloud proxy (server.py): checks the typed address before connecting.
  # No published port: only the nginx above talks to it.
  proxy:
    image: python:3.12-alpine
    command: python /app/server.py
    # Unprivileged user: the proxy only reads server.py and opens network connections
    user: "65534:65534"
    environment:
      - PORT=8081
      # All interfaces of the internal Docker network only (no published port), so nginx reaches it
      - HOST=0.0.0.0
      # Google Drive and OneDrive IDs, read from the .env file (outside git)
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - ONEDRIVE_CLIENT_ID=${ONEDRIVE_CLIENT_ID:-}
    volumes:
      - ./server:/app:ro  # folder, not the file: see above
    restart: unless-stopped
