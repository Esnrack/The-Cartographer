</head>

  <header class="topbar">
    <h1>The Cartographer</h1>
    <button id="btn-new" data-i18n-title="new_tip"><svg class="ic" aria-hidden="true"><use href="#i-new"/></svg><span data-i18n="new">Novo</span></button>
    <button id="btn-open" data-i18n-title="open_tip"><svg class="ic" aria-hidden="true"><use href="#i-open"/></svg><span data-i18n="open">Abrir</span></button>
    <input type="file" id="file-open" accept=".json,application/json" hidden>
    <button id="btn-save" data-i18n-title="save_tip"><svg class="ic" aria-hidden="true"><use href="#i-save"/></svg><span data-i18n="save">Salvar</span></button>
    <button id="btn-export" data-i18n-title="export_tip"><svg class="ic" aria-hidden="true"><use href="#i-export"/></svg><span data-i18n="export">Exportar PNG</span></button>
    <select id="export-scale" data-i18n-title="export_scale_tip">
      <option value="1">1×</option>
      <option value="2">2×</option>
    </select>
    <span class="sep"></span>
    <button id="btn-undo" data-i18n-title="undo_tip"><svg class="ic" aria-hidden="true"><use href="#i-undo"/></svg><span data-i18n="undo">Desfazer</span></button>
    <button id="btn-redo" data-i18n-title="redo_tip"><svg class="ic" aria-hidden="true"><use href="#i-redo"/></svg><span data-i18n="redo">Refazer</span></button>
    <span class="sep"></span>
    <button id="btn-planet" data-i18n-title="planet_tip"><svg class="ic" aria-hidden="true"><use href="#i-planet"/></svg><span data-i18n="planet">Planeta</span></button>
    <button id="btn-fit" data-i18n-title="fit_tip"><svg class="ic" aria-hidden="true"><use href="#i-fit"/></svg><span data-i18n="fit">Ajustar à tela</span></button>
    <span id="zoom-label" class="muted">100%</span>
    <span class="sep"></span>
    <button id="btn-tour" data-i18n-title="tour_tip"><svg class="ic" aria-hidden="true"><use href="#i-help"/></svg><span data-i18n="tour">Tutorial</span></button>
    <a id="lnk-github" class="btn-link" href="https://github.com/Esnrack/The-Cartographer" target="_blank" rel="noopener" aria-label="GitHub" data-i18n-title="github_tip"><svg class="ic brand" aria-hidden="true"><use href="#i-github"/></svg></a>
    <select id="language" data-i18n-title="language_tip"></select>
  </header>

  <main class="layout">
    <nav class="tools" id="tools">
      <button data-tool="brush"><svg class="ic" aria-hidden="true"><use href="#i-brush"/></svg><span data-i18n="tool_brush">Pincel</span> <kbd>B</kbd></button>
      <button data-tool="engraving"><svg class="ic" aria-hidden="true"><use href="#i-engraving"/></svg><span data-i18n="tool_engraving">Gravura</span> <kbd>S</kbd></button>
      <button data-tool="text"><svg class="ic" aria-hidden="true"><use href="#i-text"/></svg><span data-i18n="tool_text">Texto</span> <kbd>T</kbd></button>
      <button data-tool="select"><svg class="ic" aria-hidden="true"><use href="#i-select"/></svg><span data-i18n="tool_select">Selecionar</span> <kbd>V</kbd></button>
      <button data-tool="expand"><svg class="ic" aria-hidden="true"><use href="#i-expand"/></svg><span data-i18n="tool_expand">Expandir</span> <kbd>E</kbd></button>
    </nav>

    <div class="stage" id="stage">
      <canvas id="globe" hidden></canvas>
      <canvas id="view"></canvas>
      <div class="status" id="status" hidden></div>
    </div>

    <aside class="panel">
      <section data-for="brush">
        <h2 data-i18n="terrain">Terreno</h2>
        <div id="terrain-types" class="swatches"></div>
        <label><span data-i18n="mode">Modo</span><select id="brush-mode"><option value="brush" data-i18n="mode_brush">Pincel</option><option value="bucket" data-i18n="mode_bucket">Balde (preencher região)</option></select></label>
        <div id="brush-opts">
          <label><span data-i18n="size_radius">Tamanho (raio)</span> <output></output><input type="range" id="brush-size" min="4" max="300" step="1"></label>
          <label><span data-i18n="roughness">Irregularidade da borda</span> <output></output><input type="range" id="brush-rough" min="0" max="1" step="0.05"></label>
          <label><span data-i18n="roughness_scale">Tamanho das irregularidades</span> <output></output><input type="range" id="brush-rough-size" min="1" max="10" step="0.5"></label>
          <label class="check"><input type="checkbox" id="brush-only-land"> <span data-i18n="only_land">Pintar só sobre terra (não mexe na costa)</span></label>
          <p class="hint" data-i18n-html="brush_hint"></p>
        </div>
        <p class="hint" id="fill-hint" data-i18n="bucket_hint"></p>
      </section>

      <section data-for="engraving">
        <h2 data-i18n="engravings">Gravuras</h2>
        <label><span data-i18n="size">Tamanho</span> <output></output><input type="range" id="engraving-scale" min="0.2" max="4" step="0.05"></label>
        <label><span data-i18n="size_variation">Variação aleatória de tamanho</span> <output></output><input type="range" id="engraving-vary" min="0" max="0.6" step="0.05"></label>
        <label class="check"><input type="checkbox" id="engraving-flip"> <span data-i18n="random_flip">Espelhar aleatoriamente</span></label>
        <label class="check"><input type="checkbox" id="engraving-scatter"> <span data-i18n="scatter">Espalhar aleatoriamente num raio</span></label>
        <p class="hint" data-i18n-html="engraving_hint"></p>
        <label><span data-i18n="density">Densidade ao arrastar</span> <output></output><input type="range" id="engraving-density" min="0.3" max="4" step="0.1"></label>
        <div id="scatter-opts">
          <label><span data-i18n="scatter_radius">Raio do espalhamento</span> <output></output><input type="range" id="engraving-radius" min="0" max="300" step="5"></label>
          <label class="check"><input type="checkbox" id="engraving-only-land"> <span data-i18n="scatter_only_land">Espalhar só sobre terra</span></label>
        </div>
        <input type="search" id="lib-search" class="lib-search" data-i18n-placeholder="lib_search" autocomplete="off" spellcheck="false">
        <div id="packs" class="lib"></div>
        <div id="variants" class="lib" hidden>
          <details class="cat" open>
            <summary><h3 data-i18n="variant">Variação</h3><small></small></summary>
            <div class="grid"></div>
          </details>
        </div>
        <div id="library" class="lib"></div>
        <button id="user-assets-add" class="lib-add" data-i18n="user_assets_add">Adicionar minhas imagens…</button>
        <input type="file" id="user-assets-file" accept="image/png,image/webp,image/jpeg,image/svg+xml" multiple hidden>
        <p class="hint" data-i18n="user_assets_hint"></p>
        <p id="lib-empty" class="hint" data-i18n="lib_empty" hidden></p>
        <p class="hint" data-i18n-html="assets_hint"></p>
      </section>

      <section data-for="text">
        <h2 data-i18n="text">Texto</h2>
        <label><span data-i18n="text">Texto</span><textarea id="label-text" rows="2"></textarea></label>
        <label><span data-i18n="font">Fonte</span><select id="label-font" class="font-select"></select></label>
        <label><span data-i18n="size">Tamanho</span> <output></output><input type="range" id="label-size" min="10" max="200" step="1"></label>
        <label><span data-i18n="letter_spacing">Espaçamento entre letras</span> <output></output><input type="range" id="label-spacing" min="0" max="40" step="1"></label>
        <label><span data-i18n="curve">Curva</span> <output></output><input type="range" id="label-curve" min="-1" max="1" step="0.05" data-i18n-title="curve_tip"></label>
        <label><span data-i18n="color">Cor</span><input type="color" id="label-color"></label>
        <p class="hint" data-i18n-html="text_hint"></p>
      </section>

      <section data-for="select">
        <h2 data-i18n="selection">Seleção</h2>
        <p id="sel-empty" class="hint" data-i18n-html="selection_hint"></p>
        <p id="sel-multi" class="hint" hidden></p>
        <div id="sel-engraving" hidden>
          <label data-size><span data-i18n="size">Tamanho</span> <output></output><input type="range" id="sel-scale" min="0.1" max="6" step="0.05"></label>
          <label><span data-i18n="rotation">Rotação</span> <output></output><input type="range" id="sel-rot" min="-180" max="180" step="1"></label>
          <label class="check"><input type="checkbox" id="sel-flip"> <span data-i18n="flipped">Espelhado</span></label>
        </div>
        <div id="sel-label" hidden>
          <label><span data-i18n="text">Texto</span><textarea id="sel-text" rows="2"></textarea></label>
          <label><span data-i18n="font">Fonte</span><select id="sel-font" class="font-select"></select></label>
          <label data-size><span data-i18n="size">Tamanho</span> <output></output><input type="range" id="sel-size" min="10" max="200" step="1"></label>
          <label><span data-i18n="letter_spacing">Espaçamento entre letras</span> <output></output><input type="range" id="sel-spacing" min="0" max="40" step="1"></label>
          <label><span data-i18n="rotation">Rotação</span> <output></output><input type="range" id="sel-label-rot" min="-180" max="180" step="1"></label>
          <label><span data-i18n="curve">Curva</span> <output></output><input type="range" id="sel-curve" min="-1" max="1" step="0.05" data-i18n-title="curve_tip"></label>
          <label><span data-i18n="color">Cor</span><input type="color" id="sel-color"></label>
        </div>
        <div class="row" id="sel-actions" hidden>
          <button id="sel-duplicate" data-i18n="duplicate">Duplicar</button>
          <button id="sel-delete" class="danger" data-i18n="delete">Excluir</button>
        </div>
      </section>

      <section data-for="expand">
        <h2 data-i18n="expand_title">Expandir mapa</h2>
        <p class="hint" data-i18n-html="expand_hint"></p>
      </section>

      <details class="fold" open>
        <summary><h2 data-i18n="map_style">Estilo do mapa</h2></summary>
        <label><span data-i18n="palette">Paleta</span><select id="style-palette"></select></label>
        <label><span data-i18n="waves">Ondas na costa</span> <output></output><input type="range" id="style-waves" min="0" max="8" step="1"></label>
        <label><span data-i18n="wave_spacing">Distância entre ondas</span> <output></output><input type="range" id="style-wave-spacing" min="2" max="10" step="0.5"></label>
        <label><span data-i18n="wave_strength">Intensidade das ondas</span> <output></output><input type="range" id="style-wave-strength" min="0" max="1" step="0.05"></label>
        <label><span data-i18n="sea_depth">Profundidade do mar</span> <output></output><input type="range" id="style-depth" min="4" max="48" step="1"></label>
        <label><span data-i18n="land_outline">Contorno da terra</span> <output></output><input type="range" id="style-outline" min="0" max="8" step="0.5"></label>
        <label><span data-i18n="paper_texture">Textura de papel</span> <output></output><input type="range" id="style-grain" min="0" max="1" step="0.05"></label>
        <label><span data-i18n="vignette">Vinheta</span> <output></output><input type="range" id="style-vignette" min="0" max="1" step="0.05"></label>
        <label class="check"><input type="checkbox" id="style-shadows"> <span data-i18n="engraving_shadows">Sombra nas gravuras</span></label>
      </details>

      <details class="fold">
        <summary><h2 data-i18n="reference">Imagem de referência</h2></summary>
        <p class="hint" data-i18n="reference_hint"></p>
        <button id="ref-load" data-i18n="reference_load">Carregar imagem…</button>
        <input type="file" id="ref-file" accept="image/*" hidden>
        <div id="ref-opts" hidden>
          <label class="check"><input type="checkbox" id="ref-visible"> <span data-i18n="reference_visible">Mostrar sobre o mapa</span></label>
          <label><span data-i18n="opacity">Opacidade</span> <output></output><input type="range" id="ref-opacity" min="0.05" max="1" step="0.05"></label>
          <div class="row">
            <button id="ref-convert" data-i18n="reference_convert" data-i18n-title="reference_convert_tip">Converter em terreno</button>
            <button id="ref-remove" data-i18n="reference_remove">Remover</button>
          </div>
        </div>
      </details>
    </aside>
  </main>

  <!-- "Save" and "Open" targets: for a new target, add a button in .save-options and handle its value in main.js -->
  <dialog id="dlg-save">
    <form method="dialog">
      <h2 data-i18n="save_title">Salvar mapa</h2>
      <div class="save-options">
        <button value="local"><svg class="ic" aria-hidden="true"><use href="#i-computer"/></svg><span data-i18n="save_local">Neste dispositivo</span></button>
        <button value="cloud"><svg class="ic brand" aria-hidden="true"><use href="#i-nextcloud"/></svg><span>Nextcloud</span></button>
        <button value="gdrive"><svg class="ic brand" aria-hidden="true"><use href="#i-gdrive"/></svg><span>Google Drive</span></button>
        <button value="onedrive"><svg class="ic brand" aria-hidden="true"><use href="#i-onedrive"/></svg><span>OneDrive</span></button>
      </div>
      <div class="row end">
        <button value="cancel" data-i18n="cancel">Cancelar</button>
      </div>
    </form>
  </dialog>

  <dialog id="dlg-open">
    <form method="dialog">
      <h2 data-i18n="open_title">Abrir mapa</h2>
      <div class="save-options">
        <button value="local"><svg class="ic" aria-hidden="true"><use href="#i-computer"/></svg><span data-i18n="save_local">Neste dispositivo</span></button>
        <button value="cloud"><svg class="ic brand" aria-hidden="true"><use href="#i-nextcloud"/></svg><span>Nextcloud</span></button>
        <button value="gdrive"><svg class="ic brand" aria-hidden="true"><use href="#i-gdrive"/></svg><span>Google Drive</span></button>
        <button value="onedrive"><svg class="ic brand" aria-hidden="true"><use href="#i-onedrive"/></svg><span>OneDrive</span></button>
      </div>
      <div class="row end">
        <button value="cancel" data-i18n="cancel">Cancelar</button>
      </div>
    </form>
  </dialog>

  <dialog id="dlg-cloud">
    <form method="dialog">
      <h2 id="cloud-title">Nextcloud</h2>
      <p class="hint" id="cloud-status"></p>
      <div id="cloud-disconnected">
        <p class="hint" id="cloud-login-hint"></p>
        <label id="cloud-server-field"><span data-i18n="cloud_server">Endereço do seu Nextcloud</span>
          <span class="prefixed"><span>https://</span><input type="text" id="cloud-server" placeholder="nuvem.exemplo.com" autocomplete="url" spellcheck="false"></span>
        </label>
        <button type="button" id="cloud-connect" class="primary" data-i18n="connect">Conectar</button>
      </div>
      <div id="cloud-connected" hidden>
        <label><span data-i18n="save_as">Salvar o mapa atual como</span>
          <input type="text" id="cloud-name" data-i18n-placeholder="cloud_name_placeholder">
        </label>
        <div class="row end">
          <button type="button" id="cloud-save" class="primary">Salvar</button>
        </div>
        <h3 class="cloud-title" data-i18n="cloud_list_title">Mapas salvos</h3>
        <div id="cloud-list" class="cloud-list"></div>
      </div>
      <div class="row end">
        <button type="button" id="cloud-disconnect" hidden data-i18n="disconnect">Desconectar</button>
        <button value="cancel" data-i18n="close">Fechar</button>
      </div>
    </form>
  </dialog>

  <dialog id="dlg-new">
    <form method="dialog">
      <h2 data-i18n="new_title">Novo mapa</h2>
      <label><span data-i18n="size">Tamanho</span>
        <select id="new-preset">
          <option value="2000x1500">2000 × 1500 (4:3)</option>
          <option value="2400x1600">2400 × 1600 (3:2)</option>
          <option value="2560x1440">2560 × 1440 (16:9)</option>
          <option value="2000x2000" data-i18n="opt_square">2000 × 2000 (quadrado)</option>
          <option value="3200x2400" data-i18n="opt_large">3200 × 2400 (4:3 grande)</option>
          <option value="4000x2000" data-i18n="opt_planet">4000 × 2000 (2:1, ideal para planeta)</option>
          <option value="custom" data-i18n="opt_custom">Personalizado…</option>
        </select>
      </label>
      <div class="row" id="new-custom" hidden>
        <label><span data-i18n="width">Largura</span><input type="number" id="new-w" min="400" max="4096" step="2" value="2000"></label>
        <label><span data-i18n="height">Altura</span><input type="number" id="new-h" min="400" max="4096" step="2" value="1500"></label>
      </div>
      <label><span data-i18n="start_with">Começar com</span>
        <select id="new-fill">
          <option value="water" data-i18n="only_water">Só água (desenhe a terra)</option>
          <option value="land" data-i18n="only_land_start">Só terra (desenhe a água)</option>
          <option value="continent" data-i18n="random_continent">Continente aleatório</option>
        </select>
      </label>
      <p class="hint" data-i18n="new_warning"></p>
      <div class="row end">
        <button value="cancel" data-i18n="cancel">Cancelar</button>
        <button value="ok" class="primary" data-i18n="create">Criar</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="js/main.js"></script>
</body>
</html>
