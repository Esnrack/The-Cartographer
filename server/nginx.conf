# At most 5 proxy requests per second per visitor (bursts of 20): the proxy can't be hammered
limit_req_zone $binary_remote_addr zone=nextcloud:10m rate=5r/s;

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Behind a reverse proxy (e.g. nginx with HTTPS on the host), every request reaches this container
    # from the Docker network; take the visitor's real IP from X-Forwarded-For so the rate limit is per
    # visitor. Trusted only from the Docker networks: the published port listens on 127.0.0.1 by default.
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    include /etc/nginx/cartographer/security-headers.conf;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        try_files $uri $uri/ =404;
    }

    # No cache so swapped images show up on page reload
    location /assets/ {
        add_header Cache-Control "no-cache";
        include /etc/nginx/cartographer/security-headers.conf;
    }

    # Google Drive/OneDrive IDs: generated by server.py from .env (outside the repository)
    location = /js/storage/cloud-config.js {
        proxy_pass http://proxy:8081;
        add_header Cache-Control "no-cache";
        include /etc/nginx/cartographer/security-headers.conf;
    }

    # Nextcloud proxy: everything goes to the "proxy" service (server.py), which checks the path
    # (only login, .json in the Mapas folder and revocation) and the typed address before connecting.
    location /nextcloud/ {
        client_max_body_size 20m;
        limit_req zone=nextcloud burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://proxy:8081;
        proxy_read_timeout 60s;
        # The site does not use a Nextcloud session: no cookies in either direction
        proxy_set_header Cookie "";
        proxy_set_header Origin "";
        proxy_hide_header Set-Cookie;
    }
}
