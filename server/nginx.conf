server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        try_files $uri $uri/ =404;
    }

    # No cache so swapped images show up on page reload
    location /assets/ {
        add_header Cache-Control "no-cache";
    }

    # Google Drive/OneDrive IDs: generated by server.py from .env (outside the repository)
    location = /js/storage/cloud-config.js {
        proxy_pass http://proxy:8081;
        add_header Cache-Control "no-cache";
    }

    # Nextcloud proxy: everything goes to the "proxy" service (server.py), which checks the path
    # (only login, .json in the Mapas folder and revocation) and the typed address before connecting.
    location /nextcloud/ {
        client_max_body_size 20m;
        proxy_pass http://proxy:8081;
        proxy_read_timeout 60s;
        # The site does not use a Nextcloud session: no cookies in either direction
        proxy_set_header Cookie "";
        proxy_set_header Origin "";
        proxy_hide_header Set-Cookie;
    }
}
