# Security headers for every response. Included at server level and again in each location that has
# its own add_header (nginx drops inherited add_header lines in that case).
# CSP: only this site's scripts (+ the hashed inline script of oauth.html); Google Fonts for styles and
# fonts; images from the site, data: (terrain PNG in a map file) and blob: (user images); network calls
# to the site and HTTPS (Google Drive, Microsoft Graph and OneDrive download hosts vary); no framing.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-FrR5Sea14IeeVdt+FxxQoXgbscWgb+yBxd/a7r2rzIA='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https:; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
